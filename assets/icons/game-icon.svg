<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <clipPath id="squircle">
      <rect width="64" height="64" rx="14"/>
    </clipPath>
    <linearGradient id="sky" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a3656"/>
      <stop offset="28%" stop-color="#0c6b94"/>
      <stop offset="52%" stop-color="#22a3b8"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="88%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="sun" cx="46%" cy="56%" r="36%">
      <stop offset="0%" stop-color="#fffef0" stop-opacity="0.96"/>
      <stop offset="55%" stop-color="#fef08a" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earth" x1="32" y1="48" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e5941a"/>
      <stop offset="100%" stop-color="#c26a0a"/>
    </linearGradient>
    <linearGradient id="trail" x1="4" y1="36" x2="26" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Sky + Radiant Sun -->
    <rect width="64" height="64" fill="url(#sky)"/>
    <circle cx="30" cy="36" r="22" fill="url(#sun)"/>

    <!-- Cloud -->
    <path d="M5 18.5c0-1.7 1.3-3 3-3 .5-1.5 1.9-2.5 3.6-2.5 1.9 0 3.5 1.3 3.8 3.1 1.3.3 2.2 1.4 2.2 2.7 0 1.6-1.3 2.8-2.9 2.8H8c-1.7 0-3-1.4-3-3.1z" fill="#fffbeb" fill-opacity="0.92"/>

    <!-- Curved Golden Horizon -->
    <ellipse cx="32" cy="70" rx="46" ry="21" fill="url(#earth)"/>

    <!-- Golden Dragon Bridge (Cau Rong) -->
    <rect x="15" y="50.5" width="32" height="2.4" rx="0.6" fill="#334155"/>
    <rect x="19" y="52.8" width="2" height="2.6" fill="#94a3b8"/>
    <rect x="27" y="52.8" width="2" height="2.6" fill="#94a3b8"/>
    <rect x="35" y="52.8" width="2" height="2.6" fill="#94a3b8"/>
    <rect x="42" y="52.8" width="2" height="2.6" fill="#94a3b8"/>
    <path d="M18 50.5 Q22.5 44 26.5 48.5 Q31 43.5 35.5 48.5 Q39.5 44.5 43.5 48.5" stroke="#facc15" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <rect x="42.5" y="46.2" width="4.2" height="3.2" rx="0.6" fill="#facc15"/>
    <polygon points="46.5,46.4 53.5,47.8 46.5,49.4" fill="#f97316"/>

    <!-- Speed Trail behind plane -->
    <path d="M4 37 L24 31" stroke="url(#trail)" stroke-width="2.6" stroke-linecap="round"/>

    <!-- Fiery Red Low-Poly Meteor (upper right) -->
    <g transform="translate(50.5 14)">
      <polygon points="0,-7.5 6.8,-3.2 5.4,5.2 -1.8,7.4 -7.2,2.2 -5.8,-5.4" fill="#f43f5e"/>
      <polygon points="0,-7.5 6.8,-3.2 0.8,0.6 -5.8,-5.4" fill="#fb7185"/>
      <polygon points="6.8,-3.2 5.4,5.2 -1.8,7.4 0.8,0.6" fill="#e11d48"/>
      <polygon points="4.8,-8.8 7.5,-7.6 5.8,-5.8" fill="#fb923c"/>
    </g>

    <!-- Glowing Cyan Energy Crystals -->
    <g transform="translate(49.2 33.2)">
      <polygon points="0,-4.4 3.4,0 0,4.4 -3.4,0" fill="#22d3ee"/>
      <polygon points="0,-4.4 3.4,0 0,0" fill="#a5f3fc"/>
      <polygon points="0,4.4 -3.4,0 0,0" fill="#0891b2"/>
    </g>
    <g transform="translate(56.8 29.8)">
      <polygon points="0,-3.4 2.7,0 0,3.4 -2.7,0" fill="#22d3ee"/>
      <polygon points="0,-3.4 2.7,0 0,0" fill="#a5f3fc"/>
    </g>

    <!-- Hero Vietnam Crimson & Gold Airplane -->
    <g transform="translate(24.5 29.5) rotate(-13)">
      <!-- Tail Fin (Gold) -->
      <polygon points="-16,-4 -11,-4 -11,-11 -16,-11" fill="#facc15"/>
      <!-- Fluttering Cyan Scarf -->
      <path d="M-8,-6 L-15,-5 L-14,-3 L-7,-4 Z" fill="#38bdf8"/>
      <!-- Pilot Head & Goggles -->
      <rect x="-7.5" y="-11.5" width="6.2" height="5.8" rx="0.8" fill="#f5a87e"/>
      <rect x="-8" y="-12.4" width="6.6" height="2.4" rx="0.6" fill="#181210"/>
      <rect x="-4" y="-9.6" width="3.5" height="2.5" rx="0.5" fill="#452218"/>
      <rect x="-3.1" y="-9" width="1.9" height="1.3" fill="#7dd3fc"/>
      <!-- Windshield -->
      <rect x="-1" y="-10" width="2.2" height="5" fill="#e0f2fe" fill-opacity="0.72"/>
      <!-- Main Fuselage (Vietnam Crimson Red) -->
      <polygon points="-14,-4 9,-5.5 9,6.5 -1,6.5 -14,0" fill="#dc2626"/>
      <polygon points="-14,-4 9,-5.5 9,-2.5 -14,-2" fill="#ef4444"/>
      <!-- Wing (Metallic Gold with Red tip) -->
      <polygon points="-13,-2.5 1,-2.5 3,0.5 -15,0.5" fill="#facc15"/>
      <polygon points="-15,0.5 -10,0.5 -9.5,-2.5 -13,-2.5" fill="#dc2626"/>
      <!-- 5-Pointed Gold Star on Cabin -->
      <polygon points="-1.2,-1.6 -0.1,1.0 2.7,1.2 0.5,2.9 1.2,5.6 -1.2,4.1 -3.6,5.6 -2.9,2.9 -5.1,1.2 -2.3,1.0" fill="#fef08a"/>
      <!-- Landing Gear Fender & Wheel -->
      <rect x="-1" y="5.5" width="8.5" height="4.2" rx="0.8" fill="#b91c1c"/>
      <circle cx="3.2" cy="10.2" r="3.4" fill="#23190f"/>
      <circle cx="3.2" cy="10.2" r="1.4" fill="#f1f5f9"/>
      <!-- Golden Conical Nose Engine -->
      <ellipse cx="9" cy="1" rx="2.4" ry="5.6" fill="#f8fafc"/>
      <polygon points="9,-4.6 20,1 9,6.6" fill="#fde047"/>
      <polygon points="9,1 20,1 9,6.6" fill="#eab308"/>
      <!-- Spinning Propeller + Motion Glow -->
      <ellipse cx="18.2" cy="1" rx="3.2" ry="11.5" fill="#fef08a" fill-opacity="0.34"/>
      <line x1="15.4" y1="-8.8" x2="21.0" y2="10.8" stroke="#23190f" stroke-width="2.4" stroke-linecap="round"/>
      <line x1="21.0" y1="-8.8" x2="15.4" y2="10.8" stroke="#23190f" stroke-width="2.4" stroke-linecap="round"/>
      <circle cx="18.2" cy="1" r="1.5" fill="#59332e"/>
    </g>
  </g>
</svg>
